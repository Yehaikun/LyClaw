spring:
  application:
    name: LyClaw
server:
  port: 8080

lyclaw:
  data-dir: /home/lyjew/Documents/Unicom/LyClaw/LyClaw
  engine:
    data-dir: ./LyClaw
    default-provider: minimax
    enabled: true
    pipeline:
      timeout: 30000
      max-tool-rounds: 10

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5p) [%15.15t] %clr(%-40.40logger{39}){cyan} : %m%n"
  level:
    lyjew.com.lyclaw: DEBUG