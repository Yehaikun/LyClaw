# ============================================================
#   LyClaw 框架完整配置参考
#   所有配置项均包含框架默认值，未显式配置时使用默认值
#   优先级: 命令行参数 > 环境变量 > application.yml > 框架默认值
# ============================================================

spring:
  application:
    name: lyclaw-web-service
  mail:
    host: smtp.163.com
    port: 465
    username: sterlingmon@163.com
    password: ${MAIL_PASSWORD:JU4VC5jJLx6EvVLQ}
    protocol: smtp
    properties:
      mail.smtp.ssl.enable: true
      mail.smtp.auth: true
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
server:
  port: 8082

# ============================================================
#   Actuator / Prometheus 指标暴露
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    export:
      prometheus:
        enabled: true
  endpoint:
    prometheus:
      enabled: true

# ============================================================
#   Swagger / OpenAPI 文档配置 (springdoc)
# ============================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  api-docs:
    path: /v3/api-docs
    enabled: true
  group-configs:
    - group: default
      paths-to-match: /api/**
      packages-to-scan: lyjew.com.lyclaw.web.controller

lyclaw:
  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.chat  —  聊天模型配置  (ChatProperties)          ║
  # ║  AutoConfiguration: ChatAutoConfiguration                ║
  # ║  必须配置至少一个 models.* 才能调用 LLM                   ║
  # ╚══════════════════════════════════════════════════════════╝
  chat:
    # 默认 Provider 名称，对应 models 下的 key
    # 默认: deepseek
    default-provider: deepseek

    # 默认模型名称，请求中未指定 model 时使用
    # 默认: deepseek-v4-flash
    default-model: deepseek-v4-flash

    # 是否启用路由选择（多模型负载/故障转移）
    # 默认: false
    routing-enabled: false

    # 是否兼容旧版配置格式（lyclaw.llm.* 前缀）
    # 默认: true（向后兼容），新项目建议设为 false
    legacy: false

    # ── 模型配置（key 为 Provider 名称，可配多个） ──────────
    models:
      deepseek:
        # 协议类型
        #   openai-protocol — OpenAI 兼容协议（DeepSeek/Groq/通义千问等）
        #   anthropic       — Anthropic Messages API
        #   ollama          — Ollama 本地模型
        #   gemini          — Google Gemini API
        provider: openai-protocol

        # API 端点 Base URL
        base-url: https://api.deepseek.com

        # API 密钥，支持 ${ENV_VAR:默认值} 占位符
        api-key: ${DEEPSEEK_API_KEY:}

        # 模型名称（DeepSeek: deepseek-v4-flash / deepseek-v4-pro）
        model: deepseek-v4-flash

        # ── 重试策略（per-model） ─────────────────────
        retry:
          # 最大重试次数，默认 3
          max-attempts: 3
          # 退避策略: exponential（指数退避）| fixed（固定间隔）
          # 默认: exponential
          backoff: exponential
          # 基础延迟（毫秒），仅 fixed 策略生效，默认 1000
          base-delay-ms: 1000

        # ── 降级链（此模型不可用时依次尝试的 Provider） ──
        # 例如: ["groq", "ollama-local"] 表示 deepseek→groq→ollama
        fallback: []

        # ── 扩展参数（传递给底层 HTTP 请求的额外字段） ──
        options: {}

    # ── 全局降级链（所有模型的兜底降级顺序） ───────────
    # 单模型级别的 fallback 优先于全局 fallbackChain
    fallback-chain:
      - "deepseek/deepseek-v4-flash"
      - "openai/gpt-4o"

    # ── 全局熔断器配置 ─────────────────────────────────
    # 当某个模型连续失败达到阈值后，自动熔断一段时间
    circuit-breaker:
      # 连续失败多少次后触发熔断，默认 5
      failure-threshold: 5
      # 熔断后多久进入半开状态（秒），默认 30
      half-open-after-seconds: 30
      # 半开状态最多放行多少个请求试探，默认 3
      half-open-max-requests: 3

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.tool  —  工具执行配置  (ToolProperties)          ║
  # ║  AutoConfiguration: ToolAutoConfiguration                ║
  # ╚══════════════════════════════════════════════════════════╝
  tool:
    # 单次工具调用超时（毫秒），超时后强制中断
    # 默认: 30000（30秒）
    default-timeout-ms: 30000

    # 工具输出最大字符数，超出部分截断
    # 默认: 10000
    max-output-length: 10000

    # 同一工具在单个会话中最多调用次数，防止滥用
    # 默认: 20
    max-calls-per-tool: 20

    # 工具调用失败后最大重试次数
    # 默认: 3
    max-retries: 3

    # 单次 ReAct 循环中最多执行多少轮工具调用
    # 默认: 10
    max-rounds: 10

    # 沙箱隔离级别
    #   DIRECT  — 直接在调用线程中执行（最快，无隔离，仅可信工具）
    #   SANDBOX — 守护线程 + 临时工作目录隔离（推荐）
    #   PROCESS — 独立 OS 进程执行（最强隔离，仅 command 类工具）
    # 默认: PROCESS
    sandbox-level: PROCESS

    # Tavily 搜索 API 密钥（用于 web_search 工具）
    # 不配则 web_search 工具不可用
    tavily-api-key: ${TAVILY_API_KEY:}

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.agent  —  Agent 行为配置  (AgentProperties)      ║
  # ║  AutoConfiguration: ReActAutoConfiguration               ║
  # ╚══════════════════════════════════════════════════════════╝
  agent:
    # 默认交互模式
    #   react        — ReAct 推理-行动循环（默认）
    #   cot          — 思维链模式
    #   hierarchical — 层级多 Agent 协作
    # 默认: react
    default-mode: react

    # ReAct 循环最大工具调用轮数
    # 默认: 30
    max-tool-rounds: 100

    # 工具审批超时（秒），前端弹窗等待用户确认的时间
    # 超时自动拒绝，默认: 30
    approval-timeout-seconds: 30

    # 审批存储条目超时（秒）
    # 默认: 60
    approval-store-timeout-seconds: 60

    # 单次 Agent 调用总超时（毫秒）
    # 默认: 300000（5分钟）
    timeout-ms: 300000

    # ── Agent 全局默认值（绑定 AgentDefaultsConfig） ──────
    # 优先级: @Agent 注解 > lyclaw.agent.defaults > 系统内置默认值
    defaults:
      subagent-enabled: true
      subagent-delegation-mode: suggest
      subagent-max-concurrent: 1
      subagent-max-spawn-depth: 1
      subagent-max-children-per-agent: 5
      subagent-run-timeout-seconds: 300

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.subagent  —  子Agent运行时配置                    ║
  # ║  AutoConfiguration: AgentProxyAutoConfiguration           ║
  # ╚══════════════════════════════════════════════════════════╝
  subagent:
    # 是否全局启用子Agent生成
    # 默认: true
    enabled: true

    # 委托模式: suggest（建议，需用户确认）| prefer（优先委托）
    # 默认: suggest
    delegation-mode: suggest

    # 允许的 Agent ID 白名单，"*" 表示不限制
    # 默认: "*"
    allow-agents: "*"

    # 最大并发子Agent数量
    # 默认: 1
    max-concurrent: 1

    # 最大生成嵌套深度（1 = 不允许递归生成）
    # 默认: 1
    max-spawn-depth: 1

    # 单父Agent最多可生成的直接子Agent数
    # 默认: 5
    max-children-per-agent: 5

    # 子Agent会话归档时间（分钟），超时自动归档
    # 默认: 60
    archive-after-minutes: 60

    # 单个子Agent运行超时（秒）
    # 默认: 300
    run-timeout-seconds: 300

    # 子Agent公告超时（毫秒），等待前端响应子Agent生成确认的时间
    # 默认: 120000（2分钟）
    announce-timeout-ms: 120000

    # 是否要求生成的子Agent ID 必须在 AgentRegistry 中注册
    # 默认: false
    require-agent-id: false

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.plan  —  任务规划配置  (PlanProperties)          ║
  # ║  AutoConfiguration: ChatAutoConfiguration                ║
  # ╚══════════════════════════════════════════════════════════╝
  plan:
    # 规划生成默认超时（毫秒）
    # 默认: 30000（30秒）
    default-timeout-ms: 30000

    # 简单单节点任务超时（毫秒）
    # 默认: 10000（10秒）
    simple-timeout-ms: 10000

    # 计划中最大节点数，超出触发验证警告
    # 默认: 50
    max-nodes: 50

    # 计划执行总时间预算（毫秒）
    # 默认: 600000（10分钟）
    time-budget-ms: 600000

    # 混合规划器置信度阈值（0.0 ~ 1.0）
    #   ≥ 阈值: 规则直接生成 DAG 计划（快速）
    #   < 阈值: 回退到 LLM 驱动的任务分解（慢但准确）
    # 默认: 0.5
    hybrid-confidence-threshold: 0.5

    # ReAct 模式最大循环次数
    # 默认: 5
    max-cycles: 5

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.pipeline  —  阶段管道配置  (PipelineProperties)   ║
  # ║  AutoConfiguration: PipelineAutoConfiguration            ║
  # ╚══════════════════════════════════════════════════════════╝
  pipeline:
    # 是否启用 Stage 管道（ContextBuild → SecurityCheck →
    #   PlanExecution → Respond → Metrics）
    # 默认: true
    enabled: true

    # 管道执行总超时（毫秒）
    # 默认: 300000（5分钟）
    timeout-ms: 300000

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.storage  —  存储层配置  (StorageProperties)       ║
  # ║  AutoConfiguration: StorageAutoConfiguration             ║
  # ║  固定使用 SQLite + JSONL，不再支持后端切换                   ║
  # ╚══════════════════════════════════════════════════════════╝
  storage:
    # 存储根目录（SQLite数据库 + JSONL文件均在此目录下）
    # 目录结构: {base-path}/index/lyclaw.db
    #          {base-path}/agents/{agentId}/sessions/{sessionId}.jsonl
    # 默认: ${user.dir}/data/storage
    base-path: /home/lyjew/Documents/Unicom/LyClaw/LyClaw

    # ── 会话存储配置 ─────────────────────────────────
    session:
      # 分页/懒加载时每页消息条数
      # 默认: 50
      page-size: 50

      # 生成的 sessionId 长度（UUID前N位）
      # 默认: 8
      id-length: 8

      # 首条用户消息预览最大字符数
      # 默认: 100
      preview-max-length: 100

      # 异步写入队列容量（有界队列，防止OOM）
      # 默认: 10000
      write-queue-capacity: 10000

      # JSONL写入失败最大重试次数
      # 默认: 3
      write-max-retries: 3

      # 活跃会话缓存最大数量（LRU淘汰）
      # 默认: 1000
      cache-max-size: 1000

      # 活跃会话缓存TTL（分钟），超时未访问自动淘汰
      # 默认: 30
      cache-ttl-minutes: 30

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.extension  —  扩展注册配置  (ExtensionProperties) ║
  # ║  AutoConfiguration: ProcessorAutoConfiguration           ║
  # ╚══════════════════════════════════════════════════════════╝
  extension:
    # 是否启用扩展过滤链（根据条件过滤工具、管道阶段等）
    # 默认: true
    filtering-enabled: true

    # 扩展排序策略
    #   topology — 拓扑排序（根据 after/before 依赖推导，推荐）
    #   numeric  — 数值排序（按 order 字段升序）
    # 默认: topology
    ordering-strategy: topology

    # 遇到异常时是否立即中断注册
    #   false — 跳过失败的，继续注册剩余的（默认，开发/测试友好）
    #   true  — 立即中断整个注册流程（生产环境推荐）
    # 默认: false
    fail-fast: false

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.compaction  —  上下文压缩配置  (CompactionConfig) ║
  # ║  AutoConfiguration: CompactionAutoConfiguration          ║
  # ║  详细设计见 07-renovation-phase3 §2.1                    ║
  # ╚══════════════════════════════════════════════════════════╝
  compaction:
    # 压缩策略模式: DEFAULT（仅历史压缩）| FULL（历史+工具结果）
    # 默认: DEFAULT
    mode: DEFAULT

    # 为系统提示/引导/工具定义保留的 token 数
    # 默认: 8000
    reserve-tokens: 8000

    # 保留最近 N 个 token 对话历史不被压缩
    # 默认: 4000
    keep-recent-tokens: 4000

    # 硬性下限：即使计算建议更深裁剪，也不会压缩到低于此值
    # 默认: 2000
    reserve-tokens-floor: 2000

    # 历史消息可占 token 预算的最大份额（0.0~1.0），超出触发压缩
    # 默认: 0.5
    max-history-share: 0.5

    # 保留原样不压缩的最近对话轮次数
    # 默认: 3
    recent-turns-preserve: 3

    # 标识符保留策略: STRICT | OFF | CUSTOM
    # 默认: STRICT
    identifier-policy: STRICT

    # 压缩 LLM 调用超时（秒），默认使用更便宜/更快的模型
    # 默认: 900
    timeout-seconds: 900

    # 触发压缩的最大活跃转录字节数（~10MB）
    # 默认: 10485760
    max-active-transcript-bytes: 10485760

    # 压缩后是否截断尾部内容（而非保留摘要+尾部）
    # 默认: false
    truncate-after-compaction: false

    # 是否发送 SSE 事件通知用户压缩已发生
    # 默认: false
    notify-user: true

    # ── 质量把关（QualityGuard） ──────────
    quality-guard:
      # 压缩后询问 LLM 是否信息充足，NO 则更保守目标重试
      enabled: true
      # 最多重试验证次数
      max-retries: 2

    # ── 中途预检查（MidTurnPrecheck） ────
    mid-turn-precheck:
      # 每轮工具调用后检查上下文压力，提前触发压缩
      enabled: true
      # 上下文使用率超过此阈值时触发中途压缩（0.0~1.0）
      threshold: 0.9

    # 压缩后注入的系统提示章节（重新锚定 Agent 行为）
    post-compaction-sections:
      - "Session Startup"
      - "Red Lines"

    # ── 上下文修剪（ContextPruningConfig） ─
    # 配置前缀: lyclaw.compaction.pruning
    pruning:
      # 修剪模式: OFF | CACHE_TTL
      mode: OFF
      # 工具结果内容 TTL
      ttl: 30m
      # 保留最近 N 条助手消息不被修剪
      keep-last-assistants: 5
      # 软修剪触发阈值（上下文比例）
      soft-trim-ratio: 0.3
      # 硬清除触发阈值（上下文比例）
      hard-clear-ratio: 0.6
      # 可修剪的工具结果最小字符数
      min-prunable-tool-chars: 1000
      # 软修剪——保留头尾，中间用 "..." 替换
      soft-trim:
        max-chars: 8000
        head-chars: 2000
        tail-chars: 2000
      # 硬清除——用占位符替换整个工具结果
      hard-clear:
        enabled: true
        placeholder: "[earlier output trimmed for space]"

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.bootstrap  —  引导文件加载配置                     ║
  # ║  AutoConfiguration: BootstrapAutoConfiguration           ║
  # ║  详细设计见 07-renovation-phase3 §3                      ║
  # ╚══════════════════════════════════════════════════════════╝
  bootstrap:
    # 是否启用引导文件加载
    # 默认: false
    enabled: false

    # 单个引导文件最大字符数
    # 默认: 50000
    max-chars: 50000

    # 所有引导文件总最大字符数
    # 默认: 200000
    total-max-chars: 200000

    # 加载的文件列表（相对于 agentDir/workspaceDir）
    files:
      - "AGENTS.md"
      - "BOOTSTRAP.md"
      - "TOOLS.md"
      - "MEMORY.md"
      - "IDENTITY.md"

    # 递归扫描子目录加载引导文件
    # 默认: true
    recursive: true

    # 引导内容合并模式: PREPEND（追加到系统提示前）| SECTION（独立章节）
    # 默认: PREPEND
    merge-mode: PREPEND

    # 是否发送 bootstrap_loaded SSE 事件
    # 默认: false
    notify: false

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.routing  —  Agent 路由配置                        ║
  # ║  AutoConfiguration: RoutingAutoConfiguration             ║
  # ║  详细设计见 07-renovation-phase3 §3.3                    ║
  # ╚══════════════════════════════════════════════════════════╝
  routing:
    # 是否启用 Agent 路由器
    # 默认: false
    enabled: false

    # 默认 Agent ID（无匹配时回退）
    default-agent-id: chat

    # ── 静态路由绑定（YAML 配置） ──────────
    # 每个绑定: agentId + match条件（channel / mention / acp前缀）
    bindings:
      # 示例:
      # - agent-id: code-reviewer
      #   match:
      #     channel: "#code-review"
      # - agent-id: support-bot
      #   match:
      #     mention: "@bot help"

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.identity  —  身份与角色配置                        ║
  # ║  AutoConfiguration: IdentityAutoConfiguration             ║
  # ║  详细设计见 07-renovation-phase3 §4                      ║
  # ╚══════════════════════════════════════════════════════════╝
  identity:
    # 是否启用身份系统
    # 默认: false
    enabled: false

    # 默认角色名称
    default-role: "assistant"

    # 身份来源: FILE（IDENTITY.md 优先）| ANNOTATION（@Agent 注解优先）| CONFIG（yml 优先）
    # 默认: FILE
    source: FILE

    # 身份文件路径（相对于 agentDir）
    identity-file: "IDENTITY.md"

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.streaming  —  流式响应增强配置                     ║
  # ║  AutoConfiguration: StreamingAutoConfiguration           ║
  # ║  详细设计见 08-renovation-phase4 §4.1                    ║
  # ╚══════════════════════════════════════════════════════════╝
  streaming:
    # ── 块流式（BlockStreaming） ─────────────────
    block:
      # 是否启用基于块的流式输出
      # 默认: false
      enabled: false

      # 断块模式: TEXT_END（段落/列表项结束时断开）| MESSAGE_END（仅消息结束时断开）
      # 默认: TEXT_END
      break-mode: TEXT_END

      # 每块最大字符数
      # 默认: 80
      max-chunk-chars: 80

      # 刷新前最大空闲时间（毫秒）
      # 默认: 150
      max-idle-ms: 150

      # 是否在换行边界处刷新
      # 默认: true
      preserve-newlines: true

      # 是否过滤 <thinking> 标签
      # 默认: false
      strip-thinking: false

    # ── 人类延迟模拟（HumanDelay） ──────────────
    human-delay:
      # 是否启用人类打字延迟模拟
      # 默认: false
      enabled: false

      # 块间最小延迟（毫秒）
      # 默认: 100
      min-delay-ms: 100

      # 块间最大延迟（毫秒）
      # 默认: 400
      max-delay-ms: 400

      # 自适应速度（随回复增长加速）
      # 默认: false
      adaptive-speed: false

    # ── 输入中指示器（TypingIndicator） ────────
    typing-indicator:
      # 模式: NEVER | INSTANT | THINKING | MESSAGE
      # 默认: NEVER
      mode: NEVER

      # 指示器 SSE 事件发送间隔（秒）
      # 默认: 3
      interval-seconds: 3

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.sandbox  —  容器沙箱配置                           ║
  # ║  AutoConfiguration: SandboxAutoConfiguration             ║
  # ║  详细设计见 08-renovation-phase4 §4.2                    ║
  # ╚══════════════════════════════════════════════════════════╝
  sandbox:
    # 容器后端: NONE | DOCKER | PODMAN
    # 默认: NONE（回退到进程内 ToolSandbox）
    backend: NONE

    # 默认容器镜像
    image: "ubuntu:22.04"

    # 沙箱工作目录（容器内）
    root-dir: "/workspace"

    # 允许执行的命令列表（空=不限制）
    allowed-commands: []

    # 禁止执行的命令列表
    denied-commands:
      - "rm -rf /"
      - "shutdown"

    # 是否启用容器网络
    # 默认: false
    network-enabled: false

    # 是否允许文件系统写入
    # 默认: true
    file-system-write-enabled: true

    # 内存限制（MB）
    # 默认: 512
    memory-limit-mb: 512

    # CPU 限制（核数）
    # 默认: 1.0
    cpu-limit: 1.0

    # 容器执行超时（秒）
    # 默认: 60
    timeout-seconds: 60

    # ── 文件系统桥接 ─────────────────────────
    fs-bridge:
      # 是否将宿主机工作目录绑定挂载到容器
      # 默认: true
      enabled: true
      # 挂载模式: READ_ONLY | READ_WRITE
      # 默认: READ_WRITE
      mode: READ_WRITE

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.heartbeat  —  Agent 心跳配置                      ║
  # ║  AutoConfiguration: HeartbeatAutoConfiguration           ║
  # ║  详细设计见 08-renovation-phase4 §4.3                    ║
  # ╚══════════════════════════════════════════════════════════╝
  heartbeat:
    # 是否启用心跳系统
    # 默认: false
    enabled: false

    # 心跳间隔（cron 表达式或 Duration 如 "30m"、"1h"）
    every: "30m"

    # ── 活跃时间窗口 ─────────────────────────
    active-hours:
      # 开始时间
      start: "09:00"
      # 结束时间
      end: "18:00"
      # 时区
      timezone: "Asia/Shanghai"
      # 生效日（逗号分隔）
      days-of-week: "MON,TUE,WED,THU,FRI"

    # 心跳使用的模型（null = 使用 Agent 默认值）
    model:

    # 心跳会话标识 key
    session-key: "daily-checkin"

    # 结果投递目标: LAST | NONE
    target: LAST

    # 直接呼叫策略: ALLOW | BLOCK
    direct-policy: ALLOW

    # 投递目标地址（E.164 电话或聊天 ID）
    to:

    # 多账户选择器
    account-id:

    # 心跳提示词
    prompt: "这是例行心跳检查。请根据上下文汇报当前状态。"

    # 是否在心跳提示词中包含系统提示词章节
    # 默认: true
    include-system-prompt-section: true

    # 心跳回复确认最大字符数（用于通知预览）
    # 默认: 30
    ack-max-chars: 30

    # 是否抑制工具错误警告
    # 默认: true
    suppress-tool-error-warnings: true

    # 心跳运行超时（秒）
    # 默认: 120
    timeout-seconds: 120

    # 是否使用轻量上下文（仅加载 HEARTBEAT.md）
    # 默认: true
    light-context: true

    # 是否为每次心跳创建隔离会话
    # 默认: true
    isolated-session: true

    # 子 Agent 活跃时是否跳过心跳
    # 默认: true
    skip-when-busy: true

    # 是否包含推理/思考内容
    # 默认: false
    include-reasoning: false

    # 连续失败多少次后告警
    # 默认: 3
    max-consecutive-failures: 3

  # ╔══════════════════════════════════════════════════════════╗
  # ║  lyclaw.retry  —  运行重试增强配置  (RunRetriesConfig)     ║
  # ║  AutoConfiguration: RetryAutoConfiguration               ║
  # ║  详细设计见 08-renovation-phase4 §4.4                    ║
  # ╚══════════════════════════════════════════════════════════╝
  retry:
    # 主模型基础重试迭代次数
    # 默认: 24
    base: 24

    # 每个回退模型额外分配的迭代次数
    # 默认: 8
    per-profile: 8

    # 总重试次数最小下限
    # 默认: 32
    min: 32

    # 总重试次数最大上限
    # 默认: 160
    max: 160

    # 重试终止质量阈值（反思分数达此值则提前停止）
    # 默认: 0.7
    quality-threshold: 0.7

    # 重试模型选择策略: SAME_MODEL | FALLBACK_CHAIN | ADAPTIVE
    # 默认: ADAPTIVE
    default-strategy: ADAPTIVE

    # 升级到回退模型前允许的最大连续失败次数（仅 ADAPTIVE 策略生效）
    # 默认: 3
    max-consecutive-failures-before-fallback: 3

    # ── 指数退避配置 ─────────────────────────
    backoff:
      # 初始延迟（毫秒）
      # 默认: 1000
      initial-delay-ms: 1000
      # 退避乘数
      # 默认: 2.0
      multiplier: 2.0
      # 最大延迟（毫秒）
      # 默认: 60000
      max-delay-ms: 60000
