spring:
  application:
    name: lyclaw-web-service
server:
  port: 8082

lyclaw:
  chat:
    legacy: false
    default-provider: deepseek
    default-model: deepseek-v4-flash
    models:
      deepseek:
        provider: openai-protocol
        base-url: https://api.deepseek.com
        api-key: ${DEEPSEEK_API_KEY:}
        model: deepseek-v4-flash
  storage:
    stores:
      session: file
      entity: file
      memory: inmemory
  llm:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
