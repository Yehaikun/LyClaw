auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

# 单节点模式：使用 memberlist 做内部 ring 协调
memberlist:
  join_members:
    - localhost

common:
  path_prefix: /home/lyjew/tools/loki/data/loki
  replication_factor: 1
  ring:
    kvstore:
      store: memberlist

schema_config:
  configs:
    - from: "2025-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /home/lyjew/tools/loki/data/loki/tsdb-index
    cache_location: /home/lyjew/tools/loki/data/loki/tsdb-cache
  filesystem:
    directory: /home/lyjew/tools/loki/data/loki/chunks

limits_config:
  reject_old_samples: false
  reject_old_samples_max_age: 168h
  allow_structured_metadata: true
  max_entries_limit_per_query: 5000
