spring:
  application:
    name: lyclaw-orchestration-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: lyclaw
        group: DEFAULT_GROUP
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          default:
            connectTimeout: 5000
            readTimeout: 30000
server:
  port: 8081
