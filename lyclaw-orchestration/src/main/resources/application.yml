spring:
  application:
    name: lyclaw-orchestration-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: lyclaw
        group: DEFAULT_GROUP
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          default:
            connectTimeout: 10000
            readTimeout: 300000
server:
  port: 8081

lyclaw:
  llm:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      model: deepseek-v4-flash
