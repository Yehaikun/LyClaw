version: '3.8'
services:
  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: lyclaw-nacos
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
    healthcheck:
      test: curl -s http://localhost:8848/nacos/v1/console/health/readiness || exit 1
      interval: 10s
      timeout: 5s
      retries: 30

  lyclaw-gateway:
    build: ./lyclaw-gateway
    ports:
      - "8080:8080"
    depends_on:
      nacos:
        condition: service_healthy

  lyclaw-orchestration-service:
    build: ./lyclaw-orchestration-service
    ports:
      - "8081:8081"
    depends_on:
      nacos:
        condition: service_healthy

  lyclaw-memory-service:
    build: ./lyclaw-memory-service
    ports:
      - "8082:8082"
    depends_on:
      nacos:
        condition: service_healthy

  lyclaw-plan-service:
    build: ./lyclaw-plan-service
    ports:
      - "8083:8083"
    depends_on:
      nacos:
        condition: service_healthy

  lyclaw-action-service:
    build: ./lyclaw-action-service
    ports:
      - "8084:8084"
    depends_on:
      nacos:
        condition: service_healthy

  lyclaw-reflect-service:
    build: ./lyclaw-reflect-service
    ports:
      - "8085:8085"
    depends_on:
      nacos:
        condition: service_healthy

  lyclaw-protocol-service:
    build: ./lyclaw-protocol-service
    ports:
      - "8086:8086"
    depends_on:
      nacos:
        condition: service_healthy
