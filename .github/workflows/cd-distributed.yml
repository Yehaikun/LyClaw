name: CD - Distributed Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:        # 也支持手动触发
    inputs:
      skip_tests:
        description: '跳过测试'
        required: false
        default: false
        type: boolean
      deploy_services:
        description: '要部署的服务（逗号分隔，留空=全部）'
        required: false
        default: ''
        type: string

env:
  JAVA_VERSION: '21'
  DOCKER_REGISTRY: docker.io/haikunye     # 你的 Docker Hub 命名空间

jobs:
  # ============================================================
  # Job 1: 全量编译 + 测试
  # ============================================================
  build:
    name: Build All Modules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image-tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: 运行测试（可选跳过）
        if: ${{ !inputs.skip_tests }}
        run: mvn test -q

      - name: 编译打包所有模块
        run: mvn package -DskipTests -q

      - name: 生成镜像标签
        id: tag
        run: echo "tag=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: service-jars
          path: |
            lyclaw-gateway/target/*.jar
            lyclaw-orchestration/target/*.jar
            lyclaw-action/target/*.jar
            lyclaw-plan/target/*.jar
            lyclaw-memory/target/*.jar
            lyclaw-reflect/target/*.jar
            lyclaw-facade/target/*.jar

  # ============================================================
  # Job 2: 构建并推送全部服务镜像（矩阵并行）
  # ============================================================
  docker:
    name: Build & Push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - orchestration
          - action
          - plan
          - memory
          - reflect
          - facade
          - ui
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        if: matrix.service != 'ui'
        uses: actions/download-artifact@v4
        with:
          name: service-jars

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 构建并推送服务镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service == 'ui' && './Dockerfile.ui' || './Dockerfile' }}
          build-args: |
            SERVICE_MODULE=lyclaw-${{ matrix.service }}
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/lyclaw-${{ matrix.service }}:${{ needs.build.outputs.image-tag }}
            ${{ env.DOCKER_REGISTRY }}/lyclaw-${{ matrix.service }}:latest

  # ============================================================
  # Job 3: 并行部署到三台服务器
  # ============================================================
  deploy-aliyun:
    name: Deploy Aliyun (gateway+orchestration+ui)
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 10
    steps:
      - name: 部署 gateway + orchestration + ui 到阿里云
        uses: appleboy/ssh-action@v1
        with:
          host: 47.104.212.121
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/lyclaw
            # 拉取最新镜像
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-gateway:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-orchestration:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-ui:latest
            # 写入环境变量供 compose 使用
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
            # 重启服务
            docker compose -f docker-compose.aliyun.yml down
            docker compose -f docker-compose.aliyun.yml up -d nacos
            sleep 15
            curl -s -X POST 'http://localhost:8848/nacos/v1/console/namespaces' -d 'customNamespaceId=lyclaw&namespaceName=lyclaw' || true
            docker compose -f docker-compose.aliyun.yml up -d
            docker image prune -f

      - name: 阿里云健康检查
        run: |
          sleep 30
          curl -f http://47.104.212.121:80 || exit 1
          curl -f http://47.104.212.121:8080/actuator/health || exit 1

  deploy-huaweiyun:
    name: Deploy Huawei (action+plan)
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 10
    steps:
      - name: 部署 action + plan 到华为云
        uses: appleboy/ssh-action@v1
        with:
          host: 113.45.200.224
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/lyclaw
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-action:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-plan:latest
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
            docker compose -f docker-compose.huaweiyun.yml down
            docker compose -f docker-compose.huaweiyun.yml up -d
            docker image prune -f

      - name: 华为云健康检查
        run: |
          sleep 10
          curl -f http://113.45.200.224:8083/actuator/health || exit 1

  deploy-tengxunyun:
    name: Deploy Tencent (memory+reflect+facade)
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 10
    steps:
      - name: 部署 memory + reflect + facade 到腾讯云
        uses: appleboy/ssh-action@v1
        with:
          host: 81.71.120.92
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/lyclaw
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-memory:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-reflect:latest
            docker pull ${{ env.DOCKER_REGISTRY }}/lyclaw-facade:latest
            echo "DEEPSEEK_API_KEY=${{ secrets.DEEPSEEK_API_KEY }}" > .env
            echo "TAVILY_API_KEY=${{ secrets.TAVILY_API_KEY }}" >> .env
            docker compose -f docker-compose.tengxunyun.yml down
            docker compose -f docker-compose.tengxunyun.yml up -d
            docker image prune -f

      - name: 腾讯云健康检查
        run: |
          sleep 10
          curl -f http://81.71.120.92:8082/actuator/health || exit 1
