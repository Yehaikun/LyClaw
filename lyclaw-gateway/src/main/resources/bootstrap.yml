spring:
  application:
    name: lyclaw-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: lyclaw
        group: DEFAULT_GROUP
    gateway:
      httpclient:
        response-timeout: 300s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

server:
  port: 8080
