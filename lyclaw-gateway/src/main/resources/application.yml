spring:
  application:
    name: lyclaw-gateway
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        namespace: lyclaw
        group: DEFAULT_GROUP
    gateway:
      server:
        webflux:
          httpclient:
            response-timeout: 300s
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      default:
        enabled: true
    tags:
      application: lyclaw-gateway

info:
  app:
    name: lyclaw-gateway
    description: LyClaw Spring Cloud Gateway
    version: 0.0.1-SNAPSHOT
