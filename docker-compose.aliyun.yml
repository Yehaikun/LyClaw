version: '3.8'
services:
  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: lyclaw-nacos
    mem_limit: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
    restart: unless-stopped

  lyclaw-gateway:
    image: haikunye/lyclaw-gateway:latest
    container_name: lyclaw-gateway
    mem_limit: 256m
    ports:
      - "8080:8080"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    env_file:
      - .env
    depends_on:
      - nacos
    restart: unless-stopped

  lyclaw-orchestration:
    image: haikunye/lyclaw-orchestration:latest
    container_name: lyclaw-orchestration
    mem_limit: 256m
    ports:
      - "8081:8081"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    env_file:
      - .env
    depends_on:
      - nacos
    restart: unless-stopped

  lyclaw-ui:
    image: haikunye/lyclaw-ui:latest
    container_name: lyclaw-ui
    mem_limit: 64m
    ports:
      - "80:80"
    depends_on:
      - lyclaw-gateway
    restart: unless-stopped
