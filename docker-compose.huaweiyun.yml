version: '3.8'
services:
  nacos:
    image: nacos/nacos-server:v2.5.0
    container_name: lyclaw-nacos
    mem_limit: 512m
    ports:
      - "8848:8848"
      - "9848:9848"
    environment:
      MODE: standalone
    restart: unless-stopped

  lyclaw-action:
    image: haikunye/lyclaw-action:latest
    container_name: lyclaw-action
    mem_limit: 256m
    ports:
      - "8084:8084"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    env_file:
      - .env
    depends_on:
      - nacos
    restart: unless-stopped

  lyclaw-plan:
    image: haikunye/lyclaw-plan:latest
    container_name: lyclaw-plan
    mem_limit: 256m
    ports:
      - "8083:8083"
    environment:
      SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR: nacos:8848
    env_file:
      - .env
    depends_on:
      - nacos
    restart: unless-stopped
